<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" id="themeColor" content="#f5f5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <script>try{const l=localStorage.getItem('du-radar-language');const t=localStorage.getItem('du-radar-theme');const system=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.lang=l||'ko';document.documentElement.dataset.language=l||'ko';document.documentElement.dataset.theme=t&&t!=='system'?t:system}catch(e){}</script>
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>두레이더 | DU Radar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/du-radar.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="map-style.css">
  <style>.event-card,.event-card h3,.event-card p,.event-card dl,.event-card a{font-size:15px!important;line-height:1.5!important;text-align:left!important;word-break:keep-all;overflow-wrap:normal}.event-card h3{font-weight:700}.event-meta,.event-summary,.lost-card>small,.report-card>small{font-size:13px!important;line-height:1.65!important;text-align:left!important}.institution-pills{height:auto!important;min-height:36px!important;max-height:none!important;overflow:visible!important;display:flex!important;flex:none!important;flex-wrap:wrap!important;align-content:flex-start!important;row-gap:6px!important;padding-bottom:2px!important}.institution-card{text-align:left!important;align-items:center!important}.institution-card h2,.institution-card p{margin-left:0!important;text-align:left!important}.institution-actions{flex-direction:row!important;align-items:center!important;gap:6px!important}.institution-actions button,.institution-actions a{background:#fff!important;color:#66666d!important;border:1px solid #e1e1e6!important;border-radius:100px!important;padding:7px 10px!important;white-space:nowrap!important}</style>
  <style>.spot-card small,.spot-card em,.spot-hours,.spot-list-note,.spot-group h3,.facility-card small,.facility-card em,.event-source-note,.slot-back,.report-office small,.lost-office p{font-size:12px!important;line-height:1.5!important;color:#4c5564!important}.spot-group h3{font-weight:600}.feature-btn.active{color:#1d1d1f}.reservation-mode{font-size:12px!important}.event-source{font-size:12px!important}@media(max-width:760px){.spot-card small,.spot-card em,.spot-hours,.spot-list-note,.spot-group h3,.facility-card small,.facility-card em,.event-source-note,.slot-back,.report-office small,.lost-office p{font-size:12px!important}}html[data-theme="dark"] .spot-card small,html[data-theme="dark"] .spot-card em,html[data-theme="dark"] .spot-hours,html[data-theme="dark"] .spot-list-note,html[data-theme="dark"] .spot-group h3,html[data-theme="dark"] .facility-card small,html[data-theme="dark"] .facility-card em,html[data-theme="dark"] .event-source-note,html[data-theme="dark"] .slot-back,html[data-theme="dark"] .report-office small,html[data-theme="dark"] .lost-office p{color:#d4d9e5!important}html[data-theme="dark"] .event-source{color:#aebcff!important}html[data-theme="dark"] .feature-btn.active{color:#f5f5f7!important}html[data-theme="dark"] .feature-btn.active small{color:#c8cdd8!important}html[data-theme="dark"] .reservation-mode.active{color:#fff!important}html[data-theme="dark"] .report-office{color:#fff}html[data-theme="dark"] .report-office strong{color:#ffd0b9!important}html[data-theme="dark"] .report-office span,html[data-theme="dark"] .report-office small{color:#f0c0a9!important}</style>
</head>
<body>
  <main class="radar-app">
    <div id="map" class="map-layer" aria-label="대구대학교 경산캠퍼스 지도"></div>
    <div class="offline-notice" id="offlineNotice" role="status">인터넷이 연결되지 않았어요. 지도만 사용할 수 있어요.</div><div class="map-topbar"><span class="campus-name" data-i18n="campus">대구대학교 경산캠퍼스</span><div class="weather-pill" id="desktopWeather" hidden><span></span><b class="weather-text"></b></div></div>
    <div class="map-controls" aria-label="지도 조작"><button id="resetMap" aria-label="처음 위치로">⌂</button><span></span><button id="zoomIn" aria-label="확대">＋</button><button id="zoomOut" aria-label="축소">−</button><span></span><button id="showAllPins" aria-label="전체 핀 보기"><svg class="ui-icon"><use href="icons/ui-icons.svg#layers"></use></svg></button></div>
    <div class="pin-layer-menu" id="pinLayerMenu" hidden><strong>핀 보기</strong><button data-layer-toggle="news"><i class="layer-check"></i>소식</button><button data-layer-toggle="facility"><i class="layer-check"></i>편의시설</button><button data-layer-toggle="lost"><i class="layer-check"></i>분실물</button><button data-layer-toggle="report"><i class="layer-check"></i>제보</button><button data-layer-toggle="sports"><i class="layer-check"></i>예약</button></div>
    <svg class="map-defs" aria-hidden="true"><defs><pattern id="parking-stripes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><path d="M0 0V10" stroke="#fff" stroke-width="1.2" opacity=".8"/></pattern></defs></svg>
    <aside class="side-rail" id="sideRail">
      <div class="rail-top"><a class="app-logo" href="#" aria-label="두레이더 홈"><img src="icons/du-radar.svg" alt=""><span data-i18n="brand">두레이더</span></a><button class="pin-button" data-panel="pin"><span class="plus">＋</span><small data-i18n="pin">핀 찍기</small></button></div>
      <nav class="rail-nav" aria-label="기능 메뉴"><button class="rail-item" data-panel="news"><svg class="ui-icon"><use href="icons/ui-icons.svg#speaker"></use></svg><small data-i18n="news">소식</small></button><button class="rail-item" data-panel="facilities"><svg class="ui-icon"><use href="icons/ui-icons.svg#cup"></use></svg><small data-i18n="facilities">편의시설</small></button><button class="rail-item" data-panel="lost"><svg class="ui-icon"><use href="icons/ui-icons.svg#search"></use></svg><small data-i18n="lost">분실물</small></button><button class="rail-item" data-panel="report"><svg class="ui-icon"><use href="icons/ui-icons.svg#wrench"></use></svg><small data-i18n="report">제보</small></button><button class="rail-item" data-panel="reserve"><svg class="ui-icon"><use href="icons/ui-icons.svg#calendar"></use></svg><small data-i18n="reserve">예약</small></button></nav>
      <div class="rail-bottom"><button data-action="language" aria-label="언어 전환"><small data-language-label>한</small></button><button data-action="help" aria-label="화면 테마 전환"><svg class="ui-icon theme-icon"><use href="icons/ui-icons.svg#moon"></use></svg></button><button data-action="qr" aria-label="QR 열기"><svg class="ui-icon"><use href="icons/ui-icons.svg#qr"></use></svg></button></div>
    </aside>
    <section class="function-panel" id="functionPanel" aria-live="polite"><div class="panel-grab" id="panelGrab"></div><div class="panel-heading"><div><span class="panel-eyebrow">DU RADAR</span><h1 id="panelTitle">소식</h1></div><button class="panel-close" id="panelClose" aria-label="패널 닫기">×</button></div><div class="panel-content"><div class="coming-icon">◌</div><h2 data-i18n="preparing">준비중이에요.</h2><p data-i18n="preparingDescription">캠퍼스 정보를 모으고 있어요.<br>조금만 기다려주세요.</p></div></section>
    <button class="map-pin-fab" data-panel="pin" aria-label="핀 찍기"><span>＋</span><small data-i18n="pin">핀 찍기</small></button>
    <nav class="mobile-tabs" aria-label="모바일 기능 메뉴"><button data-panel="news"><svg class="ui-icon"><use href="icons/ui-icons.svg#speaker"></use></svg><label data-i18n="news">소식</label></button><button data-panel="facilities"><svg class="ui-icon"><use href="icons/ui-icons.svg#cup"></use></svg><label data-i18n="facilities">편의시설</label></button><button data-panel="lost"><svg class="ui-icon"><use href="icons/ui-icons.svg#search"></use></svg><label data-i18n="lost">분실물</label></button><button data-panel="report"><svg class="ui-icon"><use href="icons/ui-icons.svg#wrench"></use></svg><label data-i18n="report">제보</label></button><button data-panel="reserve"><svg class="ui-icon"><use href="icons/ui-icons.svg#calendar"></use></svg><label data-i18n="reserve">예약</label></button></nav>
    <div class="mobile-float"><a class="mobile-brand" href="#"><img src="icons/du-radar.svg" alt=""><span data-i18n="brand">두레이더</span></a><div class="weather-pill" id="mobileWeather" hidden><span></span><b class="weather-text"></b></div><div><button data-action="language" aria-label="언어 전환"><small data-language-label>한</small></button><button data-action="help" aria-label="화면 테마 전환"><svg class="ui-icon theme-icon"><use href="icons/ui-icons.svg#moon"></use></svg></button><button data-action="qr" aria-label="QR 열기"><svg class="ui-icon"><use href="icons/ui-icons.svg#qr"></use></svg></button></div></div>
    <div class="install-banner" id="installBanner" hidden><div><strong>홈 화면에 추가하면 앱처럼 쓸 수 있어요.</strong><small>두레이더를 더 빠르게 열어보세요.</small></div><button id="installApp">추가</button><button id="dismissInstall" aria-label="설치 안내 닫기">×</button></div>
    <div class="qr-modal" id="qrModal" hidden><div class="qr-card"><button id="qrClose" aria-label="QR 닫기">×</button><span>DU RADAR</span><h2>지금 주소로 열기</h2><div id="qrCode"></div><p>카메라로 스캔하면 이 앱을 바로 열 수 있어요.</p></div></div>
    <div class="map-pin-center" id="mapPinCenter" hidden><div class="picker-pin-shape"><span>＋</span></div></div><section class="pin-picker" id="pinPicker" hidden><p data-i18n="pickerGuide">지도를 움직여 핀 위치를 맞춰주세요.</p><button id="confirmLocation" data-i18n="confirmLocation">여기에 핀 찍기</button><button class="picker-cancel" id="cancelPicker" data-i18n="cancel">취소</button></section>
    <section class="pin-composer" id="pinComposer" hidden><div class="composer-head"><h2 data-i18n="newPin">새 핀 등록</h2><button id="closeComposer" aria-label="닫기">×</button></div><label><span id="pinTypeLabel" data-i18n="pinType">종류</span><select id="pinType"><option value="facility">편의시설</option><option value="lost">분실물</option><option value="report">고장제보</option></select></label><div id="lostFields" hidden><label><span>구분</span><select id="lostKind"><option value="lost">잃어버렸어요</option><option value="found">주웠어요</option></select></label><label><span>물건 종류</span><select id="lostCategory"><option>이어폰</option><option>학생증</option><option>지갑</option><option>우산</option><option>텀블러</option><option>충전기</option><option>필통</option><option>기타</option></select></label></div><div id="reportFields" hidden><label><span>고장 종류</span><select id="reportCategory"><option>콘센트</option><option>빔프로젝터</option><option>에어컨</option><option>의자</option><option>와이파이</option><option>문</option><option>엘리베이터</option><option>기타</option></select></label><div class="report-category-pills"></div></div><label id="pinTitleField"><span id="pinTitleLabel" data-i18n="pinTitle">이름</span><input id="pinTitle" maxlength="80" required placeholder="편의시설 이름을 입력해주세요."></label><label id="locationHintField"><span data-i18n="pinLocationHint">층·위치 한줄</span><input id="pinLocationHint" maxlength="100" placeholder="예) 2층 엘리베이터 옆"></label><fieldset class="amenity-options"><legend data-i18n="amenities">있는 것</legend><label><input type="checkbox" value="콘센트">콘센트</label><label><input type="checkbox" value="전자레인지">전자레인지</label><label><input type="checkbox" value="정수기">정수기</label><label><input type="checkbox" value="프린터">프린터</label><label><input type="checkbox" value="소파">소파</label></fieldset><label><span id="pinDescriptionLabel" data-i18n="pinDescription">설명</span><textarea id="pinDescription" maxlength="100" required placeholder="100자 이내로 입력해주세요."></textarea></label><button id="submitPin" class="submit-pin" data-i18n="submitPin">핀 올리기</button></section>
    <div class="toast" id="toast"></div>
  </main>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <script src="vendor/leaflet.js"></script>
  <script src="vendor/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
